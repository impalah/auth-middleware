name: tests

# Runs the suite on every supported Python so the lowest version cannot silently regress
# (the release workflow only tests the interpreter picked from pyproject.toml).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }} --all-extras --group dev

      - name: Type check
        run: uv run --all-extras mypy src

      - name: Lint
        run: uv run --all-extras ruff check src tests

      - name: Run tests
        run: uv run --all-extras pytest tests/ -q

  integration-postgres:
    # Real-database tests of the SQL assignment store (pytest marker: integration).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHZ_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --python 3.14 --all-extras --group dev

      - name: Run integration tests
        run: uv run --all-extras pytest -m integration tests/authz -q

  integration-dynamodb:
    # The DynamoDB store tests against the real DynamoDB engine (DynamoDB Local).
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      AUTHZ_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --python 3.14 --all-extras --group dev

      - name: Run integration tests
        run: uv run --all-extras pytest -m integration tests/authz/integration/test_dynamodb_store.py -q

  floci:
    # DynamoDB, PostgreSQL and MySQL stores against Floci, started with testcontainers
    # (Floci starts the real database containers through the runner's Docker socket).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --python 3.14 --all-extras --group dev

      - name: Run Floci tests
        run: uv run --all-extras pytest -m floci tests/authz/integration/test_floci.py -v
